<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>En Mantenimiento</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#0d1117;
    color:#fff;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.card{
    max-width:700px;
    background:blue;
    border:2px solid #1f6feb;
    border-radius:20px;
    padding:40px;
    box-shadow:0 0 30px rgba(31,111,235,.35);
}

.logo{
    font-size:70px;
    margin-bottom:20px;
    animation:pulse 2s infinite;
}

h1{
    font-size:38px;
    margin-bottom:20px;
    color:#58a6ff;
}

p{
    font-size:20px;
    line-height:1.6;
    color:#c9d1d9;
}

.aviso{
    margin-top:30px;
    font-size:18px;
    color:#ffd33d;
    animation:blink 1s infinite;
}

@keyframes pulse{
    50%{
        transform:scale(1.1);
    }
}

@keyframes blink{
    50%{
        opacity:.3;
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">🚧</div>

    <h1>Página ADMIN en Reforma</h1>

    <p>
        El sistema ADMINISTRADOR del Concurso de Pesca Variada JAAUKANIGAS
        se encuentra en mantenimiento y actualización.
    </p>

    <p style="margin-top:15px;">
        Disculpe las molestias.
    </p>

    <div class="aviso">
        ⚠️ Plataforma temporalmente fuera de servicio ⚠️
    </div>

</div>

</body>
</html>
